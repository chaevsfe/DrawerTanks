modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="${mod_issues_url}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    description='''${mod_description}'''
    authors="${mod_authors}"
    displayURL="${mod_homepage_url}"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="storagedrawers"
    type="required"
    versionRange="[${storagedrawers_version},)"
    ordering="AFTER"
    side="BOTH"
